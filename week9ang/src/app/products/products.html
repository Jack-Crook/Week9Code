<div class="page">
  <h1>Products</h1>

  @if (message) {
    <p class="message">{{ message }}</p>
  }

  <table>
    <thead>
      <tr>
        <th>Id</th>
        <th>Name</th>
        <th>Description</th>
        <th>Price</th>
        <th>Units</th>
        <th>Type</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (product of products; track product._id) {
        <tr>
          <td>{{ product.Id }}</td>
          <td>{{ product.Name }}</td>
          <td>{{ product.Description }}</td>
          <td>{{ product.Price }}</td>
          <td>{{ product.units }}</td>
          <td>{{ product.type }}</td>
          <td>
            <a [routerLink]="['/update', product._id]">Update</a>
            <button type="button" (click)="deleteProduct(product._id)">Delete</button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="7">No products yet.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
