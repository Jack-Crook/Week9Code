<div class="page">
  <h1>Add product</h1>

  <!-- (ngSubmit) runs addProduct() when the form is submitted -->
  <form (ngSubmit)="addProduct()">
    <!-- [(ngModel)] is two-way binding: typing updates product, and product updates the input -->
    <label>
      Id
      <input name="Id" type="number" [(ngModel)]="product.Id" required />
    </label>
    <label>
      Name
      <!-- maxlength matches the 50 character limit -->
      <input name="Name" [(ngModel)]="product.Name" maxlength="50" required />
    </label>
    <label>
      Description
      <!-- maxlength matches the 255 character limit -->
      <input name="Description" [(ngModel)]="product.Description" maxlength="255" required />
    </label>
    <label>
      Price
      <!-- step 0.01 allows 2 decimal places -->
      <input name="Price" type="number" step="0.01" [(ngModel)]="product.Price" required />
    </label>
    <label>
      Units
      <input name="units" type="number" [(ngModel)]="product.units" required />
    </label>
    <label>
      Type
      <input name="type" [(ngModel)]="product.type" />
    </label>
    <button type="submit">Add</button>
  </form>

  <!-- Show an error message if there is one -->
  @if (message()) {
    <p class="message">{{ message() }}</p>
  }
</div>
